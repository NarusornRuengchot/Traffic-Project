version: '3.8'

services:
  traffic-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kusrc-traffic-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for uploaded videos and custom model weights
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 4G
